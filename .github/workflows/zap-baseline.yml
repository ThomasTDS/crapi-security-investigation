name: zap-baseline

# Scan passivo de seguranca (OWASP ZAP Baseline) contra uma instancia efemera do crAPI.
# Disparo manual: o crAPI e pesado e proposital, entao nao faz sentido rodar em todo push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar docker-compose oficial do crAPI
        run: |
          curl -sSfL -o docker-compose.yml \
            https://raw.githubusercontent.com/OWASP/crAPI/main/deploy/docker/docker-compose.yml

      - name: Subir o crAPI
        run: docker compose -f docker-compose.yml --compatibility up -d

      - name: Aguardar o gateway responder
        run: |
          echo "Aguardando o crAPI em http://localhost:8888 ..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8888/; then
              echo "crAPI no ar."
              exit 0
            fi
            sleep 10
          done
          echo "crAPI nao respondeu a tempo." >&2
          docker compose -f docker-compose.yml logs --tail=100
          exit 1

      - name: OWASP ZAP Baseline Scan
        # Executa o ZAP diretamente via imagem oficial, em vez da action de marketplace:
        # a zaproxy/action-baseline falha nos runners atuais ao tentar publicar um
        # artifact interno proprio. Rodando o zap-baseline.py por conta propria temos
        # o mesmo scan e publicamos o relatorio no passo seguinte.
        run: |
          mkdir -p zap-out
          cp .zap/rules.tsv zap-out/rules.tsv
          chmod -R 777 zap-out
          # -I: nao retorna falha por alertas (o crAPI e vulneravel de proposito; o
          # valor aqui e o relatorio, nao um gate de build). '|| true' garante o passo verde.
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8888 -c rules.tsv -I \
              -r report_html.html -w report_md.md -J report_json.json || true

      - name: Publicar relatorio do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            zap-out/report_html.html
            zap-out/report_md.md
            zap-out/report_json.json
          if-no-files-found: ignore

      - name: Derrubar o crAPI
        if: always()
        run: docker compose -f docker-compose.yml down -v
